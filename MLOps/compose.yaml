services:
    web:
        build:
            context: ./MLflow
            dockerfile: Dockerfile
            platforms:
                - "linux/amd64"
            tags:
                - "capstone/mlflow:0.0.0"

        container_name: capstone_mlflow

        ports:
            - "5000:5000"

        restart: on-failure

#        healthcheck:
#            test: [ "CMD-SHELL", "curl --silent --fail 0.0.0.0:6969/demo_api_2/health-check || exit 1" ]
#            interval: 5m
#            timeout: 3s
#            retries: 3

        deploy:
            mode: global

            restart_policy:
                condition: on-failure
                delay: 5s
                window: 120s
                max_attempts: 3

            resources:
                limits:
                    cpus: "4"
                    memory: 2048M
                reservations:
                    cpus: "1"
                    memory: 512M