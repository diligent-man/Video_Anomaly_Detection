services:
    ai:
        build:
            context: ./AI
            dockerfile: Dockerfile
            platforms:
                - "linux/amd64"
            tags:
                - "capstone/ai:0.0.0"

        container_name: capstone_ai

        ports:
            - "6968:6968"

        restart: on-failure

        healthcheck:
            test: [ "CMD-SHELL", "curl --silent --fail http://localhost:6968/ || exit 1" ]
            interval: 5m
            timeout: 3s
            retries: 3

        volumes:
            - ~/AI_web_data/AI/weight/:/weight

        environment:
            DEVICE: "cuda"
            CONFIG_PATH: "/weight/config.json"
            WEIGHT_PATH: "/weight/best_epoch13_step2937.pt"

        deploy:
            mode: global

            restart_policy:
                condition: on-failure
                delay: 5s
                window: 120s
                max_attempts: 3

            resources:
                limits:
                    cpus: "4"
                    memory: 8192M
                reservations:
                    cpus: "1"
                    memory: 1024M
                    devices:
                        -   capabilities: [ "gpu" ]
                            device_ids: [ "all" ]
    web:
        build:
            context: ./Web/app
            dockerfile: Dockerfile
            platforms:
                - "linux/amd64"
            tags:
                - "capstone/web:0.0.0"

        container_name: capstone_app

        ports:
            - "6969:6969"

        restart: on-failure

        healthcheck:
            test: [ "CMD-SHELL", "curl --silent --fail 0.0.0.0:6969/demo_api_2/health-check || exit 1" ]
            interval: 5m
            timeout: 3s
            retries: 3

        deploy:
            mode: global

            restart_policy:
                condition: on-failure
                delay: 5s
                window: 120s
                max_attempts: 3

            resources:
                limits:
                    cpus: "4"
                    memory: 2048M
                reservations:
                    cpus: "1"
                    memory: 512M

